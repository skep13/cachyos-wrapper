# was 0.6: too see-through over the white wallpaper
background_opacity          0.94
cursor_trail 0
window_padding_width        25

include themes/noctalia.conf

font_family JetBrainsMono Nerd Font
font_size 11.5

# Retro-futurist terminal: block cursor that leaves a short light trail
cursor_shape beam
cursor_blink_interval 0.6
cursor_trail 0
